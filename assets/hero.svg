<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Yuvaraj terminal pixel art banner">
<defs>
<style>
.bg{fill:#070b12}.panel{fill:#0d1420;stroke:#273446;stroke-width:2}.g{fill:#35e879}.c{fill:#55d6ff}.w{fill:#d9e2f0}.m{fill:#ff4fd8}.y{fill:#ffd447}.muted{fill:#7e8ca3;font-family:monospace}.txt{fill:#d9e2f0;font-family:monospace;font-weight:700}.blink{animation:b 1.2s steps(1,end) infinite}@keyframes b{50%{opacity:0}}
</style>
</defs>
<rect class="bg" width="900" height="330" rx="12"/><rect class="panel" x="18" y="18" width="864" height="294" rx="8"/>
<circle cx="38" cy="38" r="5" fill="#ff5f56"/><circle cx="55" cy="38" r="5" fill="#ffbd2e"/><circle cx="72" cy="38" r="5" fill="#27c93f"/>
<text x="95" y="43" class="muted" font-size="13">yuvaraj@developer: ~/profile</text>
<g transform="translate(55 82)" shape-rendering="crispEdges">
<rect x="0" y="0" width="250" height="175" fill="#09101b"/>
<!-- pixel terminal character -->
<rect class="m" x="84" y="12" width="82" height="12"/><rect class="m" x="72" y="24" width="106" height="12"/><rect class="c" x="82" y="36" width="86" height="12"/>
<rect class="w" x="92" y="48" width="66" height="44"/><rect class="g" x="100" y="54" width="18" height="10"/><rect class="g" x="132" y="54" width="18" height="10"/><rect class="m" x="112" y="72" width="34" height="8"/>
<rect class="c" x="66" y="92" width="118" height="12"/><rect class="c" x="54" y="104" width="142" height="12"/>
<rect class="w" x="38" y="116" width="174" height="28"/><rect class="g" x="52" y="124" width="28" height="10"/><rect class="g" x="92" y="124" width="28" height="10"/><rect class="g" x="132" y="124" width="28" height="10"/><rect class="y" x="172" y="124" width="20" height="10"/>
<rect class="m" x="20" y="150" width="210" height="8"/>
</g>
<g transform="translate(355 84)">
<text class="g" font-family="monospace" font-size="16">$ whoami --verbose</text>
<text x="0" y="42" class="txt" font-size="31">YUVARAJ V</text>
<text x="0" y="73" class="c" font-family="monospace" font-size="16">engineering student / developer</text>
<text x="0" y="112" class="muted" font-size="14">focus  → Java · DSA · Full Stack · AI</text>
<text x="0" y="137" class="muted" font-size="14">build   → practical software projects</text>
<text x="0" y="162" class="muted" font-size="14">status  → learning / building / shipping</text>
<text x="0" y="205" class="g" font-family="monospace" font-size="14">$ echo "turning ideas into products"<tspan class="blink">_</tspan></text>
</g>
</svg>
